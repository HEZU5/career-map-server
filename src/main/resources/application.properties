spring.application.name=career-map-server

# Render chèn biến PORT; local không có thì dùng 8080.
server.port=${PORT:8080}

# Local dev mặc định: Postgres ở 127.0.0.1:5433 (xem docker-compose.yml).
# Trên Render, các biến PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD được
# render.yaml nạp tự động từ PostgreSQL mà Render cấp.
spring.datasource.url=jdbc:postgresql://${PGHOST:127.0.0.1}:${PGPORT:5433}/${PGDATABASE:career_map}
spring.datasource.username=${PGUSER:careermap}
spring.datasource.password=${PGPASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=info