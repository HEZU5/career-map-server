spring.application.name=career-map-server

# Render chèn biến PORT; local không có thì dùng 8080.
server.port=${PORT:8080}
# Bind mọi network interface để Render/Docker truy cập được (Spring mặc định
# đã là 0.0.0.0; khai báo tường minh cho chắc).
server.address=0.0.0.0
# KHÔNG bật server.error.include-message=always: khoá đó đưa nội dung
# exception NỘI BỘ vào body lỗi 500 (JDBC URL + user DB, tên bảng/constraint
# SQL, tên biến môi trường). Chỉ lỗi do code chủ động ném
# (ResponseStatusException — luôn kèm câu tiếng Việt) mới có field
# "message": xem ResponseStatusExceptionAdvice. Lỗi 500 giữ body mặc định
# của Spring, KHÔNG có "message". Client đọc field "message" trong body
# JSON lỗi.
server.error.include-message=never

# Nguồn DB: Neon (https://console.neon.tech) hoặc Postgres local trong
# docker-compose.yml. Render nạp PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD từ
# PostgreSQL của Render qua render.yaml.
# Neon BẮT BUỘC sslmode=require; Postgres local thì để PGSSLMODE=disable.
spring.datasource.url=jdbc:postgresql://${PGHOST:127.0.0.1}:${PGPORT:5433}/${PGDATABASE:career_map}?sslmode=${PGSSLMODE:disable}
spring.datasource.username=${PGUSER:careermap}
spring.datasource.password=${PGPASSWORD:123456}

# Neon free plan tự scale-to-zero: lần kết nối đầu phải đánh thức DB mất
# 1–5s, còn Hikari mặc định fail ngay lúc khởi động → sửa thành chờ.
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
# Neon pooler ngắt kết nối rảnh sau ~5 phút → hạn vòng đời pool xuống 4 phút
# để không dính "connection reset" giữa hai ván.
spring.datasource.hikari.max-lifetime=240000

# CORS: danh sách origin (pattern) được phép gọi REST + WebSocket, phẩy ngăn
# cách. Mặc định đã gồm Firebase Hosting của app + localhost cho dev. Override
# ở Render bằng biến môi trường CORS_ALLOWED_ORIGINS nếu đổi tên miền.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://career-map-2026-b08f1.web.app,https://career-map-2026-b08f1.firebaseapp.com}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=info

# --- Luật thắng + luật thanh toán -----------------------------------------
# Ngưỡng đủ điều kiện mua báo cáo Holland: đi được >= 1 vòng (tức đã CHẠM ô
# START lần thứ 2) VÀ trả lời >= 15 câu.
# LƯU Ý: bàn có 53 ô và MỌI ô trừ START đều phải trả lời
# (TurnCoordinator#needsAnswerAt) => 1 vòng ≈ 52 câu trả lời, KHÔNG phải 4.
# => Trên thực tế ngưỡng bị VÒNG chi phối (đi 1 vòng là đã đủ câu trả lời);
# vế 15 câu chỉ là chốt an toàn cho ván ngắn. Client đọc chung qua
# GET /api/game/config nên đổi ở đây là áp dụng cho cả hai vế.
game.win-min-laps=${WIN_MIN_LAPS:1}
game.win-min-answers=${WIN_MIN_ANSWERS:15}
# Điểm chiến thắng cộng thêm cho người chơi đủ điều kiện khi ván TỰ kết thúc
# (đi qua ô START). Server tự cộng — client không được tự khai điểm.
game.win-bonus-points=${WIN_BONUS_POINTS:5}
# Công cụ test cộng điểm online. Chỉ bật trên local/staging; production mặc định tắt.
game.debug-tools-enabled=${GAME_DEBUG_TOOLS_ENABLED:false}
# Đơn thanh toán VNPay: 50.000đ, hạn 15 phút. Client đếm ngược từ
# payment.ttl-minutes nên đừng đổi chỗ này một mình.
payment.amount-vnd=${PAYMENT_AMOUNT_VND:50000}
payment.ttl-minutes=${PAYMENT_TTL_MINUTES:15}

# --- VNPay ---
# VNPay đang bật hay không. Mặc định TẮT: client đọc qua GET /api/game/config
# và ẨN nút "Nhận báo cáo" khi chưa bật (bấm vào lúc đó chỉ nhận lỗi).
# Bật lên khi đã cấu hình đủ TmnCode/HashSecret/ReturnUrl/IpnUrl.
# Lưu ý: giá trị phải là "true"/"false" — để trống sẽ làm app không khởi
# động được (Spring không đổi chuỗi rỗng thành boolean).
vnpay.enabled=${VNPAY_ENABLED:false}
# Khoá riêng tư (HashSecret) đọc từ biến môi trường Render — KHÔNG hardcode.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.ipn-url=${VNPAY_IPN_URL:}
# URL gateway VNPay. Mac dinh la API 2.1.0 (paymentv2/vpcpay.html) - API CU
# (paymentgateway/paymenturl.htm) DA BI VNPAY THU HOI, tra ve HTTP 404.
vnpay.base-url=${VNPAY_BASE_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# Thuat toan chu ky. RONG = TU CHON THEO PHIEN BAN API (2.1.0 -> HmacSHA512,
# hash 128 hex ky tu; API cu -> HmacSHA256). Chi dat khi can ghim thu cong.
# Chap nhan ca "SHA512" va "HmacSHA512".
vnpay.hash-algorithm=${VNPAY_HASH_ALGORITHM:}
# Kieu hash gui kem cho gateway qua vnp_SecureHashType. RONG = khong gui (gateway
# tu mac dinh). Dat "SHA256"/"SHA512" khi gateway yeu cau khai bao ro.
# LUU Y: API 2.1.0 KHONG duoc gui vnp_SecureHashType - server bo qua tham so nay
# khi dang dung API 2.1.0.
vnpay.hash-type=${VNPAY_HASH_TYPE:}
# Bo giao thuc VNPay. Mac dinh "pay" (API 2.1.0). API cu dung "pay_web".
vnpay.command=${VNPAY_COMMAND:pay}
# Phien ban API (vnp_Version). Mac dinh "2.1.0" - API 2.1.0 BAT BUOC tham so nay.
# API cu (pay_web) de rong = khong gui.
vnpay.version=${VNPAY_VERSION:2.1.0}
# Ma danh muc hang hoa (vnp_OrderType). Mac dinh "other" - API 2.1.0 BAT BUOC
# tham so nay. API cu (pay_web) de rong = khong gui.
vnpay.order-type=${VNPAY_ORDER_TYPE:other}

# --- Quản trị ---------------------------------------------------------
# Chuỗi bí mật bảo vệ API quản trị (/api/admin/*). Client Flutter gửi header
# X-Admin-Secret khớp với giá trị này. Để trống = TẮT hoàn toàn API quản trị
# (tránh lộ dữ liệu khi chưa cấu hình).
app.admin-secret-key=${ADMIN_SECRET_KEY:}
