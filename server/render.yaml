# Render Blueprint cho backend career-map-server.
# CÁCH DÙNG: đẩy repo lên GitHub rồi ở Render chọn
# "New + → Blueprint" và trỏ tới repo này (branch main).
#
# LƯU Ý: Render KHÔNG có runtime Java native (chỉ Node/Python/Ruby/Go/Rust/
# Elixir), nên service chạy bằng Docker qua Dockerfile ở gốc repo.
# Database dùng Neon (không tạo Postgres của Render nữa).
#
# ⚠️ QUAN TRỌNG — file này NẰM trong `server/`, mà Render Blueprint CHỈ đọc
#    `render.yaml` ở GỐC repo. ⇒ Blueprint KHÔNG tìm thấy file này.
#    ⇒ Phải deploy bằng WEB SERVICE THỦ CÔNG.
#    Hướng dẫn đầy đủ + danh sách biến môi trường bắt buộc: `server/DEPLOY.md`.
#
# Nếu muốn dùng Blueprint: copy file này lên GỐC repo (render.yaml ở root).
#
# Còn 5 biến VNPay BẮT BUỘC (VNPAY_ENABLED, VNPAY_TMN_CODE, VNPAY_HASH_SECRET,
# VNPAY_RETURN_URL, VNPAY_IPN_URL) xem `server/DEPLOY.md` mục 2.2.

services:
  - type: web
    name: career-map-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Thông tin Neon (https://console.neon.tech → Connection details).
      # sync: false → Render hỏi giá trị lúc tạo service và KHÔNG lưu vào git.
      # Dùng host dạng pooler: <project>-pooler.<region>.aws.neon.tech
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      # Neon bắt buộc SSL.
      - key: PGSSLMODE
        value: require
      # Không bật công cụ cộng điểm trên production.
      - key: GAME_DEBUG_TOOLS_ENABLED
        value: "false"
      # Tuỳ chọn: bỏ comment nếu đổi tên miền Firebase Hosting.
      # Mặc định trong application.properties đã gồm domain hiện tại.
      # - key: CORS_ALLOWED_ORIGINS
      #   sync: false
