# Render Blueprint cho backend career-map-server (Java/Spring Boot qua Docker)
# Cách dùng: đẩy repo lên GitHub, rồi ở Render chọn "New + → Blueprint" và trỏ repo này.

services:
  - type: web
    name: career-map-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile   # Dockerfile nằm trong thư mục server/
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Neon Postgres — nhập giá trị vào Render dashboard khi tạo service (không lưu trong git)
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSLMODE
        value: require
